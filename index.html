  <style>
    html.preload-active, html.preload-active body {
      overflow: hidden !important;
      height: 100%;
    }

    #preloader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #preloader.preloader-hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .preloader-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    /* Logo turun dari atas, lalu mengendap di tengah */
    .preloader-logo {
      opacity: 0;
      transform: translateY(-120px) scale(0.92);
      animation: logoDrop 0.9s cubic-bezier(.22, 1, .36, 1) forwards;
      animation-delay: 0.15s;
    }

    .preloader-logo svg {
      display: block;
      width: clamp(150px, 34vw, 220px);
      height: auto;
    }

    @keyframes logoDrop {
      0% {
        opacity: 0;
        transform: translateY(-120px) scale(0.92);
      }
      60% {
        opacity: 1;
        transform: translateY(6px) scale(1.01);
      }
      80% {
        transform: translateY(-2px) scale(1);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Subjudul: huruf muncul satu per satu setelah logo mengendap */
    .preloader-sub {
      display: flex;
      font-family: 'Plus Jakarta Sans', Helvetica, Arial, sans-serif;
      font-size: clamp(0.7rem, 1.6vw, 0.85rem);
      font-weight: 600;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #6b7280;
    }

    .preloader-sub .letter {
      display: inline-block;
      opacity: 0;
      transform: translateY(10px);
      animation: subLetterIn 0.45s ease forwards;
    }

    .preloader-sub .letter.space {
      width: 0.32em;
    }

    @keyframes subLetterIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .preloader-bar {
      width: 150px;
      height: 2px;
      border-radius: 999px;
      background: rgba(0, 128, 55, 0.15);
      overflow: hidden;
      opacity: 0;
      animation: preloaderFadeIn 0.6s ease forwards;
      animation-delay: 1.45s;
    }

    .preloader-bar::after {
      content: '';
      display: block;
      width: 36%;
      height: 100%;
      background: #008037;
      border-radius: 999px;
      animation: preloaderBarMove 1.2s ease-in-out infinite;
    }

    @keyframes preloaderFadeIn {
      to { opacity: 1; }
    }

    @keyframes preloaderBarMove {
      0%   { transform: translateX(-110%); }
      50%  { transform: translateX(140%); }
      100% { transform: translateX(320%); }
    }

    @media (max-width: 480px) {
      .preloader-sub { letter-spacing: 0.24em; }
    }

    @media (prefers-reduced-motion: reduce) {
      .preloader-logo,
      .preloader-sub .letter,
      .preloader-bar,
      .preloader-bar::after {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>

  <script>
    (function () {
      // Huruf subjudul muncul satu per satu, dimulai setelah logo selesai turun.
      var sub = document.getElementById('preloader-sub');
      if (sub) {
        var text = 'WONOKROMO \u00B7 SURABAYA';
        var startDelay = 0.95; // detik — dimulai setelah logo mengendap
        var step = 0.045;      // jarak antar huruf (detik)
        var delay = startDelay;
        text.split('').forEach(function (ch) {
          var span = document.createElement('span');
          span.className = 'letter' + (ch === ' ' ? ' space' : '');
          span.textContent = ch === ' ' ? '\u00A0' : ch;
          span.style.animationDelay = delay.toFixed(2) + 's';
          sub.appendChild(span);
          delay += step;
        });
      }

      function hidePreloader() {
        var el = document.getElementById('preloader');
        if (!el) return;
        document.documentElement.classList.remove('preload-active');
        el.classList.add('preloader-hide');
        setTimeout(function () {
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }, 600);
      }

      var minTimeReached = false;
      var pageReady = false;

      function tryHide() {
        if (minTimeReached && pageReady) hidePreloader();
      }

      // Durasi minimum disesuaikan agar seluruh urutan animasi
      // (logo turun ~1.05s + huruf muncul ~1.85s) selesai sebelum fade-out.
      setTimeout(function () { minTimeReached = true; tryHide(); }, 2200);

      window.addEventListener('load', function () {
        pageReady = true;
        tryHide();
      });

      // Fallback: jangan biarkan preloader tampil selamanya
      setTimeout(hidePreloader, 6000);
    })();
  </script>
